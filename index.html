<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: transparent;
            color: #000000 !important; 
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .timer-wrapper {
            text-align: center;
            user-select: none;
        }

        #statusLabel {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.4em;
            margin-bottom: -2px;
            opacity: 0.4;
            font-weight: 600;
            color: #000000;
            transition: opacity 0.3s;
        }

        #timer {
            font-size: 5.5rem;
            font-weight: 300; 
            margin: 0;
            font-variant-numeric: tabular-nums;
            letter-spacing: -3px;
            color: #000000;
        }

        .controls {
            margin-top: 5px;
            opacity: 0;
            transition: opacity 0.2s ease-in-out;
        }

        .timer-wrapper:hover .controls {
            opacity: 1;
        }

        button {
            background: transparent;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #000000;
            opacity: 0.5;
            font-weight: 500;
        }

        button:hover {
            opacity: 1;
        }

        .dot {
            color: #000000;
            opacity: 0.2;
            margin-left: 2px;
        }
    </style>
</head>
<body>

<div class="timer-wrapper">
    <div id="statusLabel">FOCUS</div>
    <div id="timer">25:00<span class="dot">.</span></div>
    
    <div class="controls">
        <button id="startBtn">Start</button>
        <button id="resetBtn">Reset</button>
        <button id="switchBtn">Modus</button>
    </div>
</div>

<script>
    let isFocusPhase = true;
    let timeLeft = 25 * 60;
    let timerId = null;
    let isRunning = false;

    const timerDisplay = document.getElementById('timer');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const switchBtn = document.getElementById('switchBtn');
    const statusLabel = document.getElementById('statusLabel');

    function updateDisplay() {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        timerDisplay.innerHTML = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}<span class="dot">.</span>`;
    }

    function toggleMode() {
        clearInterval(timerId);
        isRunning = false;
        startBtn.textContent = 'Start';
        
        isFocusPhase = !isFocusPhase;
        if (isFocusPhase) {
            timeLeft = 25 * 60;
            statusLabel.textContent = "FOCUS";
        } else {
            timeLeft = 5 * 60;
            statusLabel.textContent = "BREAK";
        }
        updateDisplay();
    }

    function toggleTimer() {
        if (isRunning) {
            clearInterval(timerId);
            startBtn.textContent = 'Start';
        } else {
            timerId = setInterval(() => {
                timeLeft--;
                updateDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timerId);
                    isRunning = false;
                    alert(isFocusPhase ? "Zeit für eine Pause!" : "Pause vorbei!");
                    toggleMode(); // Wechselt automatisch nach Ablauf
                }
            }, 1000);
            startBtn.textContent = 'Pause';
        }
        isRunning = !isRunning;
    }

    function resetTimer() {
        clearInterval(timerId);
        isRunning = false;
        timeLeft = isFocusPhase ? 25 * 60 : 5 * 60;
        updateDisplay();
        startBtn.textContent = 'Start';
    }

    startBtn.addEventListener('click', toggleTimer);
    resetBtn.addEventListener('click', resetTimer);
    switchBtn.addEventListener('click', toggleMode);

    updateDisplay();
</script>

</body>
</html>
