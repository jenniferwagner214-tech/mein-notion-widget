<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: transparent;
            color: #000000;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .timer-wrapper {
            text-align: center;
            user-select: none;
        }

        /* Status-Text: Jetzt ohne farbigen Hintergrund, nur cleaner Text */
        #statusLabel {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5em;
            margin-bottom: 5px;
            font-weight: 600;
            color: #000000;
            opacity: 0.4;
        }

        #timer {
            font-size: 5.5rem;
            font-weight: 300;
            margin: 0;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            letter-spacing: -3px;
            color: #000000;
        }

        .controls {
            margin-top: 15px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .timer-wrapper:hover .controls {
            opacity: 1;
        }

        button {
            background: transparent;
            border: 1px solid rgba(0,0,0,0.1);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #000000;
            margin: 0 2px;
            transition: all 0.2s;
        }

        button:hover {
            border-color: #000000;
            background: rgba(0,0,0,0.05);
        }

        .dot {
            opacity: 0.2;
        }
    </style>
</head>
<body>

<div class="timer-wrapper">
    <div id="statusLabel">FOKUS</div>
    <div id="timer">25:00<span class="dot">.</span></div>
    
    <div class="controls">
        <button id="startBtn">Start</button>
        <button id="pauseModeBtn">Pause-Modus</button>
        <button id="resetBtn">Reset</button>
    </div>
</div>

<script>
    let timeLeft = 25 * 60;
    let timerId = null;
    let isRunning = false;
    let currentMode = 'focus'; // 'focus' oder 'break'

    const timerDisplay = document.getElementById('timer');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const pauseModeBtn = document.getElementById('pauseModeBtn');
    const statusLabel = document.getElementById('statusLabel');

    function updateDisplay() {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        timerDisplay.innerHTML = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}<span class="dot">.</span>`;
    }

    function setMode(mode) {
        clearInterval(timerId);
        isRunning = false;
        startBtn.textContent = 'Start';
        currentMode = mode;
        
        if (mode === 'focus') {
            timeLeft = 25 * 60;
            statusLabel.textContent = 'FOKUS';
        } else {
            timeLeft = 5 * 60;
            statusLabel.textContent = 'PAUSE';
        }
        updateDisplay();
    }

    function toggleTimer() {
        if (isRunning) {
            clearInterval(timerId);
            startBtn.textContent = 'Start';
        } else {
            timerId = setInterval(() => {
                timeLeft--;
                updateDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timerId);
                    isRunning = false;
                    alert(currentMode === 'focus' ? "Zeit für eine Pause!" : "Pause vorbei!");
                    setMode(currentMode === 'focus' ? 'break' : 'focus');
                }
            }, 1000);
            startBtn.textContent = 'Stopp';
        }
        isRunning = !isRunning;
    }

    startBtn.addEventListener('click', toggleTimer);
    
    resetBtn.addEventListener('click', () => {
        setMode(currentMode);
    });

    pauseModeBtn.addEventListener('click', () => {
        if (currentMode === 'focus') {
            setMode('break');
            pauseModeBtn.textContent = 'Fokus-Modus';
        } else {
            setMode('focus');
            pauseModeBtn.textContent = 'Pause-Modus';
        }
    });

    updateDisplay();
</script>

</body>
</html>
